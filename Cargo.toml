[package]
name = "pito-jobs"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "Live job records, app heartbeats and progress lines for command-line tools and apps, written best-effort and read back by monitors"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-jobs"
homepage = "https://pitomd.com"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
