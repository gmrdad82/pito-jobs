app = "pito-jobs"
bin = "demo"
grid = [104, 6]
frame = "window"
prompt = "$ "
typing = "60ms"

[build]
command = "cargo build --release --locked --example demo"
bin_dir = "{target}/release/examples"

[env]
HOME = "home"
TMPDIR = "temp"

[theme]
name = "Catppuccin Mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
selection = "#45475a"
cursor = "#f5e0dc"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
brightBlack = "#585b70"
brightRed = "#f38ba8"
brightGreen = "#a6e3a1"
brightYellow = "#f9e2af"
brightBlue = "#89b4fa"
brightMagenta = "#f5c2e7"
brightCyan = "#94e2d5"
brightWhite = "#a6adc8"

[shots.demo]
kind = "clip"
line = "Three jobs write their records while a reader draws them once a second: an encode and a render finish, a fetch fails with its error"
tape = "render/terminal/demo.tape"
launch = "mkdir -p temp && export PATH={bin}:$PATH && clear"
settle = "400ms"
